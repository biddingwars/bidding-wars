<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/bidding-wars/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#D6161F">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bidding Wars">
<meta name="description" content="A country auction game. Population is points, money runs out.">
<title>Bidding Wars</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="curtain" aria-hidden="true">
  <div class="curtain-mark">Bidding<br>Wars</div>
</div>

<button class="mute" id="mute" aria-label="Sound on or off">♪</button>
<button class="homebtn" id="hb" aria-label="Back to main menu">☰ Menu</button>

<div class="wrap">
  <div class="mast">
    <h1>Bidding<br>Wars</h1>
    <div class="sub">Use your knowledge to beat your rivals</div>
  </div>
  <main id="app"></main>
  <div class="foot">NO ACCOUNTS · NO TRACKING · <span id="cc">0</span> COUNTRIES</div>
</div>

<script>
  function loadThreeFallback(){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onerror=function(){ window.__noThree=1; };
    document.head.appendChild(s);
  }
</script>
<script src="three.min.js" onerror="loadThreeFallback()"></script>

<script src="platform.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="globe.js"></script>
<script>
  Promise.all([loadLang(), loadRec()]).then(function () {
    var sub = document.querySelector('.mast .sub');
    if (sub) sub.textContent = t('tagline');
    home();
    Shell.ready();
    var c = document.getElementById('curtain');
    if (c) { c.classList.add('gone'); setTimeout(function(){ c.remove(); }, 420); }
    if ('serviceWorker' in navigator && !Native.is && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  });
</script>
</body>
</html>
